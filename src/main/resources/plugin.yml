name: PendingWhitelist
main: dev.darkspirit69.pendingwhitelist.PendingWhitelistPlugin
version: '${version}'
api-version: "26.2"
authors: [Dark_Spirit69]
website: https://github.com/DarkSpirit006/PendingWhitelist
softdepend: [floodgate, SkinsRestorer]
description: Tracks players rejected by the whitelist and provides GUI and command administration.
commands:
  wl:
    description: Manage pending whitelist entries and open the admin GUI.
    usage: /wl <pl|list|add|remove|rpl|on|off|reload|version>
    permission: pendingwhitelist.admin
permissions:
  pendingwhitelist.admin:
    description: Allows managing the pending whitelist plugin.
    default: op
