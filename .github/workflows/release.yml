name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Calculate the next patch version
        id: version
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          latest_version=${latest_tag#v}

          if [[ -z "$latest_version" || "$latest_version" == "$latest_tag" ]]; then
            latest_version=1.2.0
          fi

          IFS=. read -r major minor patch <<< "$latest_version"
          next_version="$major.$minor.$((patch + 1))"

          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "Next release: v$next_version"

      - name: Build the plugin
        run: ./gradlew build -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "build/libs/PendingWhitelist-$VERSION.jar" \
            --title "PendingWhitelist v$VERSION" \
            --generate-notes
