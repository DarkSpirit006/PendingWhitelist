plugins {
    id 'java'
}

group = 'dev.darkspirit69'
version = providers.gradleProperty('releaseVersion').getOrElse('1.2.0')

description = 'Tracks players rejected by a server whitelist and provides in-game review commands.'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.60-beta'
    implementation 'com.google.code.gson:gson:2.13.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

tasks.jar {
    archiveBaseName.set('PendingWhitelist')
    manifest {
        attributes('Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Dark_Spirit69')
    }
}
